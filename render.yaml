# Render Blueprint — deploys the Spider web server (and optionally the bot).
# In the Render dashboard: New > Blueprint, point it at this repo. Then fill the
# env vars marked sync:false in the dashboard (they're secrets).
services:
  - type: web
    name: spider-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false          # set to https://<your-render-url>/auth/callback
      - key: SESSION_SECRET
        generateValue: true  # Render generates a strong secret for you
      - key: PUBLIC_URL
        sync: false          # set to https://<your-render-url>
      # Persistent credits — paste from a free Upstash Redis database.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  # Optional: the Discord bot as a background worker. Remove if you don't want it.
  - type: worker
    name: spider-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run bot
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Same Upstash database as the web service, so credits stay in sync.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
