# Render Blueprint — deploys the Spider web server, which ALSO runs the Discord
# bot in-process (Render's free plan doesn't run standalone background workers,
# so embedding the bot in the web service is what makes it work on free).
# In the Render dashboard: New > Blueprint, point it at this repo. Then fill the
# env vars marked sync:false in the dashboard (they're secrets).
services:
  - type: web
    name: spider-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false          # set to https://<your-render-url>/auth/callback
      - key: SESSION_SECRET
        generateValue: true  # Render generates a strong secret for you
      - key: PUBLIC_URL
        sync: false          # set to https://<your-render-url>
      # Discord bot — runs inside this web service (see startBot in index.js).
      # Can be a SEPARATE Discord app from login; just set its token here.
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      # Optional: set to your server id for instant slash-command registration.
      - key: DISCORD_GUILD_ID
        sync: false
      # Persistent credits — paste from a free Upstash Redis database.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Lightning AI — required for the opus-4.8 model option.
      # Set ONE of these (or both — API key wins):
      #   LIGHTNING_API_KEY  → sk-lit-... (preferred, doesn't expire weekly)
      #   LIGHTNING_USER_ID  → optional companion to the API key (X-Grid-User)
      #   LIGHTNING_AUTH     → "Bearer eyJ..." fallback for a user-session JWT
      - key: LIGHTNING_API_KEY
        sync: false
      - key: LIGHTNING_USER_ID
        sync: false
      - key: LIGHTNING_AUTH
        sync: false
